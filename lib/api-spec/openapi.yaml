openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: calendar
    description: Central availability calendar operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /calendar/sync:
    post:
      operationId: syncCalendars
      tags: [calendar]
      summary: Sync OTA calendar feeds
      description: Fetches configured Booking.com, Airbnb, and MakeMyTrip iCal feeds and merges their busy periods.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSyncInput"
      responses:
        "200":
          description: Calendar feeds synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSyncResponse"
        "400":
          description: Invalid calendar feed configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Calendar feed could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSyncResponse"
  /calendar/feed-info:
    get:
      operationId: getCalendarFeedInfo
      tags: [calendar]
      summary: Get the outbound calendar feed link
      description: Returns the private iCal subscription URL for authenticated calendar administrators.
      responses:
        "200":
          description: Outbound calendar feed link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeedInfo"
        "401":
          description: Admin sign-in required
        "503":
          description: Outbound calendar feed is not configured
  /calendar/feed:
    get:
      operationId: getCalendarFeed
      tags: [calendar]
      summary: Read the merged outbound iCal feed
      description: Returns a token-protected iCal feed containing the merged blocked periods from the connected OTA calendars.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Merged iCal calendar
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Invalid calendar feed token
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CalendarSyncInput:
      type: object
      properties:
        bookingCom:
          type: ["string", "null"]
        airbnb:
          type: ["string", "null"]
        makeMyTrip:
          type: ["string", "null"]
      additionalProperties: false
    CalendarEvent:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
          enum: [bookingCom, airbnb, makeMyTrip]
        title:
          type: ["string", "null"]
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        allDay:
          type: boolean
      required: [id, source, title, start, end, allDay]
    CalendarSourceStatus:
      type: object
      properties:
        source:
          type: string
          enum: [bookingCom, airbnb, makeMyTrip]
        label:
          type: string
        status:
          type: string
          enum: [connected, missing, error]
        eventCount:
          type: number
        message:
          type: string
        lastSyncedAt:
          type: ["string", "null"]
          format: date-time
      required: [source, label, status, eventCount, message, lastSyncedAt]
    CalendarSyncResponse:
      type: object
      properties:
        syncedAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CalendarSourceStatus"
      required: [syncedAt, events, sources]
    CalendarFeedInfo:
      type: object
      properties:
        feedUrl:
          type: string
          format: uri
      required: [feedUrl]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

