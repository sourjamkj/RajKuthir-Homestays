<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A neutral, brand-level head, and deliberately nothing page-specific.

      This one file is the shell for EVERY route. The API server rewrites the
      head per request (api-server/src/lib/seo.ts) with each page's own title,
      description, canonical and structured data. If that rewrite is ever
      skipped — it throws and app.ts falls back to this file as-is, or the
      shell is served by something other than the API server — whatever is
      written here goes out on /gallery, /rates and every other URL alike.

      So: no canonical and no og:url, because a canonical pointing at the
      homepage would tell Google that every inner page is a duplicate of it.
      No description, because the homepage's would be wrong everywhere else.
      No image preload, because only the homepage renders that image. The
      title and share card below are true of any page on the site.
    -->
    <title>Raj Kuthir Homestays</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Raj Kuthir Homestays" />
    <meta property="og:title" content="Raj Kuthir Homestays" />
    <meta property="og:image" content="https://rajkuthirhomestays.casa/villa-night.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Raj Kuthir Homestays, Sobuj Potro — the villa lit up after sundown" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raj Kuthir Homestays" />
    <meta name="twitter:image" content="https://rajkuthirhomestays.casa/villa-night.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
