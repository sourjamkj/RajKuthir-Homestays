<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Day or night at the villa, set before first paint (src/lib/daylight.ts holds the same maths, and a test keeps them equal).
      // Marks guest pages only; the owner's console and printable documents stay light.
      (function () {
        if (/^\/(admin|invoice|management-documents)(\/|$)/.test(location.pathname)) return;
        var now = new Date(), r = Math.PI / 180, lat = 23.68, lon = 87.68;
        var day = Math.floor((Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - Date.UTC(now.getUTCFullYear(), 0, 0)) / 864e5);
        var g = 2 * Math.PI / 365 * (day - 1);
        var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
        var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
        var ha = Math.acos(Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(dec)) - Math.tan(lat * r) * Math.tan(dec)) / r;
        var m = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;
        var night = m < 720 - 4 * (lon + ha) - eq || m >= 720 - 4 * (lon - ha) - eq;
        var mode = night ? 'night' : 'day';
        // A visitor's Lights choice holds for the visit, until the sun changes state (LightsSwitch writes it).
        try { var c = JSON.parse(sessionStorage.getItem('rk-lights') || 'null'); if (c && c.sun === mode && (c.mode === 'day' || c.mode === 'night')) mode = c.mode; } catch (e) {}
        document.documentElement.setAttribute('data-daylight', mode);
      })();
    </script>
    <!--
      A neutral, brand-level head, and deliberately nothing page-specific.

      This one file is the shell for EVERY route. The API server rewrites the
      head per request (api-server/src/lib/seo.ts) with each page's own title,
      description, canonical and structured data. If that rewrite is ever
      skipped — it throws and app.ts falls back to this file as-is, or the
      shell is served by something other than the API server — whatever is
      written here goes out on /gallery, /rates and every other URL alike.

      So: no canonical and no og:url, because a canonical pointing at the
      homepage would tell Google that every inner page is a duplicate of it.
      No description, because the homepage's would be wrong everywhere else.
      No image preload, because only the homepage renders that image. The
      title and share card below are true of any page on the site.
    -->
    <title>Raj Kuthir Homestays</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Raj Kuthir Homestays" />
    <meta property="og:title" content="Raj Kuthir Homestays" />
    <meta property="og:image" content="https://rajkuthirhomestays.casa/villa-night.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Raj Kuthir Homestays, Sobuj Potro — the villa lit up after sundown" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raj Kuthir Homestays" />
    <meta name="twitter:image" content="https://rajkuthirhomestays.casa/villa-night.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
